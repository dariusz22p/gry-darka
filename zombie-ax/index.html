<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zombie AX</title>
<meta name="theme-color" content="#12181f" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; overscroll-behavior: none;
    background: #12181f; color: #e8edf2;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  #wrap { max-width: 1320px; margin: 0 auto; padding: 0 10px; height: 100%; display: flex; flex-direction: column; }
  #layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    grid-template-areas: "stage help";
    gap: 14px;
    align-items: start;
    flex: 1;
    min-height: 0;
  }
  #sidebar { grid-area: help; display: grid; gap: 6px; align-content: start; }
  #hud { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 11px; }
  #hud .stat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 4px 8px; border: 1px solid #2f3d4e; border-radius: 6px; background: #18212c;
  }
  #hud b { color: #fff; text-align: right; white-space: nowrap; }
  #ingameHudTop, #ingameHudBottom {
    position: absolute; left: 2px; width: 92px; z-index: 2;
    display: flex; flex-direction: column; gap: 2px; font-size: 6px; pointer-events: none;
  }
  #ingameHudTop { top: 44px; }
  #ingameHudBottom { bottom: 36px; }
  #ingameHudTop .stat, #ingameHudBottom .stat {
    display: flex; align-items: center; justify-content: space-between; gap: 3px;
    padding: 2px 3px; border: 0; border-radius: 3px; background: rgba(15,20,27,.22);
  }
  .bar { flex: 1; height: 14px; border-radius: 7px; background: #26313f; border: 1px solid #3a4c60; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #ef5350, #b71c1c); transition: width .12s linear; }
  #stage { position: relative; overflow: hidden; }
  #stageCol { grid-area: stage; max-width: 1080px; width: 100%; margin: 0 auto; }
  canvas#game { display: block; width: 100%; height: auto; background: #0f141b; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(8,12,17,.78); z-index: 4;
  }
  #overlay.hidden { display: none; }
  #overlay button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 18px;
    font-size: 15px; font-weight: 600; background: #4f9dff; color: #fff; }
  #alert {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(7,11,16,.72); color: #ffd180; font-weight: 700;
    opacity: 0; transition: opacity .18s linear; pointer-events: none; z-index: 3;
  }
  #alert.show { opacity: 1; }
  .variant-badge {
    position: absolute; bottom: 6px; right: 6px; z-index: 2;
    font-size: 18px; font-weight: 900; letter-spacing: 2px;
    background: rgba(255, 0, 110, 0.2); border: 2px solid #ff006e;
    padding: 4px 12px; border-radius: 6px; color: #ff006e; opacity: 0.7; transition: opacity .15s ease;
  }
  #stage:hover .variant-badge { opacity: 1; }
  #shopIcon {
    position: absolute; top: 6px; left: 6px; z-index: 3;
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    background: rgba(0, 217, 255, 0.15); border: 2px solid #00d9ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all .15s ease; user-select: none;
  }
  #shopIcon:hover { background: rgba(0, 217, 255, 0.4); transform: scale(1.08); box-shadow: 0 0 14px rgba(0,217,255,.6); }
  #shopIcon .coinTag {
    position: absolute; bottom: -7px; right: -7px;
    background: #ffd180; color: #12181f; font-size: 9px; font-weight: 800;
    padding: 0 4px; border-radius: 7px; min-width: 14px; text-align: center;
  }
  #shopPanel {
    position: absolute; bottom: 6px; left: 6px; z-index: 3;
    background: rgba(16, 16, 42, 0.9); border: 2px solid #00d9ff;
    padding: 12px; border-radius: 8px; min-width: 140px; display: none;
  }
  #shopPanel h3 { margin: 0 0 8px; color: #00d9ff; font-size: 12px; }
  .shop-item {
    padding: 6px; margin: 4px 0; border-radius: 4px;
    background: rgba(0, 217, 255, 0.1); border: 1px solid #00d9ff;
    font-size: 10px; cursor: pointer; transition: all .15s ease;
  }
  .shop-item:hover { background: rgba(0, 217, 255, 0.3); }
  .shop-item.bought { opacity: 0.5; cursor: not-allowed; }
  #mobileBombBtn, #mobileNukeBtn {
    display: none; position: absolute; width: 56px; height: 56px; border: 0;
    border-radius: 50%; font-size: 24px; font-weight: 700; cursor: pointer; z-index: 2; transition: all .15s ease;
  }
  #mobileBombBtn { left: 6px; top: 50%; transform: translateY(-50%); background: rgba(239,83,80,.42); color: rgba(255,255,255,.82); }
  #mobileBombBtn:hover { background: rgba(239,83,80,.72); }
  #mobileNukeBtn { left: 6px; bottom: 6px; background: rgba(255,193,7,.42); color: rgba(0,0,0,.82); }
  #mobileNukeBtn:hover { background: rgba(255,193,7,.72); }
  footer { text-align: center; margin-top: 6px; font-size: 10px; opacity: .4; }
  .back { display: inline-block; margin-right: 6px; text-decoration: none; color: #4f9dff; }
  #help { font-size: 11px; line-height: 1.4; }
  #help span { display: block; margin: 4px 0; opacity: .7; }
  @media (max-width: 768px) {
    #layout { grid-template-columns: 1fr; grid-template-areas: "stage" "help"; }
    #mobileBombBtn, #mobileNukeBtn { display: block !important; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="layout">
      <div id="stageCol">
        <div id="stage">
          <canvas id="game" width="1200" height="640"></canvas>
          <div id="shopIcon" title="Sklep">🛍️<span class="coinTag" id="iconCoins">0</span></div>
          <div id="shopPanel">
            <h3>🛍️ SHOP</h3>
            <div id="shopItems"></div>
            <div id="shopCoins" style="margin-top: 8px; text-align: center; font-size: 12px; color: #ffd180;">💰 0</div>
          </div>
          <button id="mobileBombBtn">💣</button>
          <button id="mobileNukeBtn">🔫</button>
          <div id="ingameHudTop">
            <div class="stat"><span>Timer</span><b id="timer">0:00</b></div>
            <div class="stat"><span>Zombies</span><b id="zombieCount">0</b></div>
            <div class="stat"><span>Level</span><b id="waveLevel">1</b></div>
          </div>
          <div id="ingameHudBottom">
            <div class="stat base"><span>Baza</span><div class="bar"><i id="hpfill"></i></div></div>
            <div class="stat"><span>Ekipa</span><b id="squad">1</b></div>
            <div class="stat"><span>Moc</span><b id="power">0</b></div>
            <div class="stat"><span>Zabici</span><b id="kills">0</b></div>
            <div class="stat"><span>Weapon</span><b id="weapon">gun</b></div>
            <div class="stat"><span>Coins</span><b id="coins" style="color: #ffd180;">0</b></div>
          </div>
          <div id="alert"></div>
          <div id="overlay" class="hidden">
            <h2 id="overTitle">GAME OVER</h2>
            <p id="overSub"></p>
            <button id="restart">Play Again (R)</button>
          </div>
          <div class="variant-badge">AX</div>
        </div>
      </div>
      <aside id="sidebar">
        <div id="hud">
          <div class="stat"><span>Mode</span>
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>
        <div id="help">
          <a class="back" href="../">← Back</a>
          <span><strong>Controls:</strong></span>
          <span>↑↓ or W/S = Move</span>
          <span>SPACE = Shoot</span>
          <span>🛍️ icon = Shop</span>
          <span>P = Pause</span>
          <span>F = Fullscreen</span>
          <span>R = Restart</span>
          <span>ESC/H = Menu</span>
        </div>
      </aside>
    </div>
    <footer>🎮 Zombie AX — Endless Waves</footer>
  </div>

  <script>
    'use strict';

    const CONFIG = { W: 1200, H: 640, baseHpMax: 100, spawnEvery: 0.72 };
    const SHOOTER_X = CONFIG.W - 60;   // team on the RIGHT
    const BASE_X = CONFIG.W - 44;      // base breach line on the RIGHT
    const GATE_SPEED = 1.2;            // gates 2x faster (was 0.6)
    const FIRERATE_INC = 0.1;          // fireRate gate: +0.1 per pellet (flat)

    let audioContext, master, muted = false;
    function ensureAudio() {
      if (audioContext) return;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      master = audioContext.createGain();
      master.gain.value = 0.18;
      master.connect(audioContext.destination);
    }
    function playSound(freq, dur, type = 'sine') {
      if (!audioContext || muted) return;
      const osc = audioContext.createOscillator();
      const env = audioContext.createGain();
      osc.connect(env);
      env.connect(master);
      osc.frequency.value = freq;
      osc.type = type;
      env.gain.setValueAtTime(0.3, audioContext.currentTime);
      env.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
      osc.start(audioContext.currentTime);
      osc.stop(audioContext.currentTime + dur);
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });

    let state = 'play', gameTime = 0, steering = false, targetY = CONFIG.H / 2;
    let keys = { up: false, down: false };
    let baseHp = CONFIG.baseHpMax, coins = 0, squadSize = 1, fireRate = 1, damage = 1;
    let kills = 0, hasLaser = false, laserActive = false;
    const zombies = [], bullets = [], gates = [];
    let nextGateTime = 0;

    const ZOMBIE_STATS = {
      verySlow: { speed: 0.5, hp: 6, size: 9, color: '#5aa02a', stroke: '#3c6d1c' },
      slow: { speed: 1, hp: 5, size: 8, color: '#6fb03a', stroke: '#4a7724' },
      normal: { speed: 1.5, hp: 4, size: 8, color: '#8bd450', stroke: '#5c8f34' },
      fast: { speed: 2.25, hp: 3, size: 7, color: '#b6e77a', stroke: '#7ba548' },
      armored: { speed: 0.75, hp: 10, size: 11, color: '#8a8f98', stroke: '#565b63' },
      yellow: { speed: 1.5, hp: 12, size: 8, color: '#ffe000', stroke: '#b39b00' },
      red: { speed: 1.5, hp: 12, size: 9, color: '#ff3b3b', stroke: '#a11f1f' },
      boss: { speed: 1, hp: 1000, size: 24, color: '#f4f4f4', stroke: '#b0b0b0' },
    };

    function spawnZombie(type = null) {
      if (!type) {
        const types = ['verySlow', 'slow', 'normal', 'fast', 'armored'];
        type = types[Math.floor(Math.random() * types.length)];
      }
      const stats = ZOMBIE_STATS[type];
      const y = Math.random() * (CONFIG.H - 60) + 30;
      zombies.push({
        x: -30, y: y, type: type,
        hp: stats.hp, maxHp: stats.hp,
        speed: stats.speed, size: stats.size, color: stats.color, stroke: stats.stroke,
      });
    }

    function spawnGate() {
      const rewards = ['fireRate', 'damage', 'health'];
      const reward = rewards[Math.floor(Math.random() * rewards.length)];
      // per-pellet increment scales with current damage: dmg gate +=damage, heal +=10*damage
      const inc = reward === 'damage' ? damage
                : reward === 'health' ? 10 * damage
                : FIRERATE_INC;
      gates.push({
        x: -70, y: Math.random() * (CONFIG.H - 200) + 30,
        width: 70, height: 170, reward: reward, inc: inc, value: inc, collected: false,
      });
      nextGateTime = gameTime + 14;
    }

    function showAlert(text, dur = 1) {
      const alert = document.getElementById('alert');
      alert.textContent = text;
      alert.classList.add('show');
      setTimeout(() => alert.classList.remove('show'), dur * 1000);
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    const minY = () => 30, maxY = () => CONFIG.H - 30;

    function update(dt) {
      gameTime += dt;

      if (keys.up) targetY = clamp(targetY - 3, minY(), maxY());
      if (keys.down) targetY = clamp(targetY + 3, minY(), maxY());

      if (gameTime > 60 && gameTime < 60.5) showAlert('⚠️ YELLOW WAVE!');
      if (gameTime > 180 && gameTime < 180.5) showAlert('🔴 RED WAVE!');
      if (gameTime > 300 && gameTime < 300.5) showAlert('👑 WHITE BOSS!');

      if (gameTime > 60 && gameTime % 2 < 0.1) spawnZombie('yellow');
      if (gameTime > 180 && gameTime % 2.5 < 0.1) spawnZombie('red');
      if (gameTime > 300 && gameTime < 301) spawnZombie('boss');

      if (Math.random() < CONFIG.spawnEvery * dt && gameTime < 300) spawnZombie();

      if (gameTime > nextGateTime) spawnGate();
      gates.forEach((g, i) => {
        g.x += GATE_SPEED;
        if (g.x > CONFIG.W + 40) gates.splice(i, 1);
      });

      // Gun: fire straight bullets LEFT at a rate scaled by fireRate & squad
      if (!hasLaser) {
        const shotsPerSec = 5 * fireRate * squadSize;
        if (state === 'play' && Math.random() < shotsPerSec * dt) {
          bullets.push({ x: SHOOTER_X - 12, y: targetY, vx: -9, vy: 0, damage: damage });
          playSound(400, 0.05);
        }
      }

      // Laser: continuous beam firing LEFT, 1/5 gun strength, hits every zombie in the lane
      laserActive = false;
      if (hasLaser && state === 'play') {
        laserActive = true;
        const dps = 5 * fireRate * squadSize * damage * 0.2; // 1/5 of gun DPS
        zombies.forEach(z => {
          if (Math.abs(z.y - targetY) < 55 && z.x < SHOOTER_X - 5) z.hp -= dps * dt;
        });
      }

      bullets.forEach((b, i) => {
        b.x += b.vx;
        if (b.x < 0) bullets.splice(i, 1);
      });

      zombies.forEach((z, zi) => {
        z.x += z.speed;
        if (z.x > BASE_X) {
          baseHp -= 10;
          zombies.splice(zi, 1);
          if (baseHp <= 0) {
            state = 'lose';
            document.getElementById('overTitle').textContent = '💀 GAME OVER';
            document.getElementById('overSub').textContent = 
              `Time: ${Math.floor(gameTime)}s\nEnemies: ${kills}\nCoins: ${coins}`;
            document.getElementById('overlay').classList.remove('hidden');
            playSound(200, 0.5);
          }
        }
      });

      bullets.forEach((b, bi) => {
        zombies.forEach((z) => {
          if (z.hp > 0 && Math.hypot(b.x - z.x, b.y - z.y) < z.size + 8) {
            z.hp -= b.damage;
            bullets.splice(bi, 1);
          }
        });
      });

      // Shoot a gate to charge its reward (each pellet adds gate.inc, scaled by your damage)
      bullets.forEach((b, bi) => {
        gates.forEach(g => {
          if (!g.collected && b.x >= g.x && b.x <= g.x + g.width && b.y >= g.y && b.y <= g.y + g.height) {
            g.value += g.inc;
            bullets.splice(bi, 1);
          }
        });
      });

      // Unified death check (bullets + laser both count toward kills/coins)
      for (let zi = zombies.length - 1; zi >= 0; zi--) {
        if (zombies[zi].hp <= 0) {
          zombies.splice(zi, 1);
          coins += 1;
          kills += 1;
          playSound(800, 0.1);
        }
      }

      gates.forEach(g => {
        if (!g.collected && g.x <= SHOOTER_X && g.x + g.width >= SHOOTER_X) {
          if (targetY >= g.y && targetY <= g.y + g.height) {
            g.collected = true;
            if (g.reward === 'fireRate') fireRate += g.value;
            else if (g.reward === 'damage') damage += g.value;
            else if (g.reward === 'health') { CONFIG.baseHpMax += g.value; baseHp += g.value; }
            const shown = g.reward === 'health' ? Math.round(g.value)
                        : g.reward === 'fireRate' ? g.value.toFixed(2)
                        : (Number.isInteger(g.value) ? g.value : g.value.toFixed(1));
            showAlert(`📊 ${g.reward} +${shown}`);
            playSound(1200, 0.15);
          }
        }
      });

      baseHp = Math.max(0, baseHp);
    }

    function draw() {
      const bg = ctx.createLinearGradient(0, 0, 0, CONFIG.H);
      bg.addColorStop(0, '#16202c');
      bg.addColorStop(1, '#0b1017');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
      // faint grid
      ctx.strokeStyle = 'rgba(120,170,220,0.05)';
      ctx.lineWidth = 1;
      for (let gx = 60; gx < CONFIG.W; gx += 60) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CONFIG.H); ctx.stroke(); }
      for (let gy = 60; gy < CONFIG.H; gy += 60) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CONFIG.W, gy); ctx.stroke(); }

      ctx.strokeStyle = 'rgba(255,82,82,.7)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(BASE_X, 10);
      ctx.lineTo(BASE_X, CONFIG.H - 10);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,82,82,.08)';
      ctx.fillRect(BASE_X, 0, CONFIG.W - BASE_X, CONFIG.H);

      // Team (shooter with gun barrel, on the RIGHT, barrel pointing left)
      ctx.strokeStyle = '#111'; ctx.lineCap = 'round'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(SHOOTER_X, targetY); ctx.lineTo(SHOOTER_X - 26, targetY); ctx.stroke();
      ctx.fillStyle = '#dbe6f2';
      ctx.save();
      ctx.shadowColor = 'rgba(79,157,255,.9)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(SHOOTER_X, targetY, 13, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#2b6cc0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#12181f';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(squadSize, SHOOTER_X, targetY);
      ctx.textBaseline = 'alphabetic';

      zombies.forEach(z => {
        ctx.fillStyle = z.color;
        ctx.strokeStyle = z.stroke || '#3c6d1c';
        ctx.lineWidth = z.type === 'boss' ? 3 : 2;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (z.hp < z.maxHp) {
          const bw = z.size * 2.1;
          ctx.fillStyle = '#0f141b';
          ctx.fillRect(z.x - bw / 2, z.y - z.size - 10, bw, 5);
          ctx.fillStyle = z.type === 'boss' ? '#ffb199' : '#8bd450';
          ctx.fillRect(z.x - bw / 2, z.y - z.size - 10, bw * (z.hp / z.maxHp), 5);
        }
      });

      ctx.save();
      ctx.shadowColor = 'rgba(255,224,130,.9)'; ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffe082';
      bullets.forEach(b => { ctx.fillRect(b.x - 5, b.y - 2, 10, 4); });
      ctx.restore();

      if (laserActive && hasLaser) {
        ctx.fillStyle = 'rgba(0, 255, 0, 0.6)';
        ctx.fillRect(0, targetY - 50, SHOOTER_X, 100);
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 3;
        ctx.strokeRect(0, targetY - 50, SHOOTER_X, 100);
      }

      gates.forEach(g => {
        const gc = { fireRate: '#4f9dff', damage: '#ef5350', health: '#8bd450' }[g.reward];
        const labels = { fireRate: 'FIRE RATE', damage: 'DAMAGE', health: 'HEAL' };
        const valStr = g.reward === 'health' ? '+' + Math.round(g.value)
                     : g.reward === 'fireRate' ? '+' + g.value.toFixed(2)
                     : '+' + (Number.isInteger(g.value) ? g.value : g.value.toFixed(1));
        ctx.fillStyle = g.collected ? 'rgba(120,120,120,.12)' : (gc + '22');
        ctx.fillRect(g.x, g.y, g.width, g.height);
        ctx.strokeStyle = g.collected ? '#666' : gc;
        ctx.lineWidth = 4;
        ctx.strokeRect(g.x, g.y, g.width, g.height);
        ctx.fillStyle = g.collected ? '#666' : gc;
        ctx.fillRect(g.x - 4, g.y - 8, g.width + 8, 10);
        ctx.fillRect(g.x - 4, g.y + g.height - 2, g.width + 8, 10);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = g.collected ? '#888' : '#fff';
        ctx.font = 'bold 12px "Segoe UI", sans-serif';
        ctx.fillText(labels[g.reward], g.x + g.width / 2, g.y + g.height / 2 - 12);
        ctx.fillStyle = g.collected ? '#888' : gc;
        ctx.font = 'bold 20px "Segoe UI", sans-serif';
        ctx.fillText(valStr, g.x + g.width / 2, g.y + g.height / 2 + 14);
        ctx.restore();
      });

      document.getElementById('timer').textContent = 
        `${Math.floor(gameTime / 60)}:${String(Math.floor(gameTime) % 60).padStart(2, '0')}`;
      document.getElementById('zombieCount').textContent = zombies.length;
      document.getElementById('waveLevel').textContent = Math.ceil(gameTime / 10);
      document.getElementById('squad').textContent = squadSize;
      document.getElementById('power').textContent = Math.round(damage * 100);
      document.getElementById('kills').textContent = kills;
      document.getElementById('weapon').textContent = hasLaser ? 'LASER' : 'gun';
      document.getElementById('coins').textContent = coins;
      document.getElementById('iconCoins').textContent = coins;
      document.getElementById('hpfill').style.width = (baseHp / CONFIG.baseHpMax * 100) + '%';
    }

    function gameLoop() {
      if (state === 'play') update(1 / 60);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function updateShop() {
      const shopItems = document.getElementById('shopItems');
      shopItems.innerHTML = '';
      const items = [
        { id: 'laser', name: '🔫 Laser', cost: 5000, bought: hasLaser },
      ];
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'shop-item' + (item.bought ? ' bought' : '');
        div.textContent = `${item.name} (${item.cost})`;
        if (!item.bought) {
          div.onclick = () => {
            if (coins >= item.cost) {
              coins -= item.cost;
              hasLaser = true;
              document.getElementById('weapon').textContent = 'LASER';
              updateShop();
              showAlert('✨ LASER!');
              playSound(1500, 0.3);
            } else {
              showAlert('💰 Need ' + (item.cost - coins));
            }
          };
        }
        shopItems.appendChild(div);
      });
      document.getElementById('shopCoins').textContent = `💰 ${coins}`;
    }

    function toggleShop(force) {
      const shop = document.getElementById('shopPanel');
      const show = force !== undefined ? force : shop.style.display === 'none' || !shop.style.display;
      shop.style.display = show ? 'block' : 'none';
      if (show) updateShop();
    }

    document.getElementById('shopIcon').addEventListener('click', () => { ensureAudio(); toggleShop(); });

    const pointerY = (e) => clamp((e.clientY - canvas.getBoundingClientRect().top) * (CONFIG.H / canvas.getBoundingClientRect().height), minY(), maxY());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      ensureAudio();
      if (state === 'play') {
        steering = true;
        targetY = pointerY(e);
      }
    });

    window.addEventListener('pointermove', e => {
      if (steering && state === 'play') targetY = pointerY(e);
    });

    window.addEventListener('pointerup', () => { steering = false; });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      ensureAudio();
      if (state === 'play') targetY = clamp(targetY + Math.sign(e.deltaY) * 40, minY(), maxY());
    }, { passive: false });

    window.addEventListener('keydown', e => {
      ensureAudio();
      if (e.key === 'Escape' || e.key === 'h' || e.key === 'H') {
        window.location.href = '../';
        return;
      }
      if (e.key === 'r' || e.key === 'R') { location.reload(); return; }
      if (e.key === 'm' || e.key === 'M') {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 0.18;
        return;
      }
      if (e.key === 'p' || e.key === 'P') {
        state === 'play' ? state = 'pause' : state = 'play';
        return;
      }
      if (e.key === 'f' || e.key === 'F') {
        const target = document.getElementById('stage');
        if (!document.fullscreenElement) {
          target.requestFullscreen().catch(() => showAlert('BLOCKED'));
        } else {
          document.exitFullscreen();
        }
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        keys.up = true;
        e.preventDefault();
      }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        keys.down = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    });

    document.getElementById('restart').addEventListener('click', () => location.reload());
    document.getElementById('difficulty').addEventListener('change', e => { CONFIG.difficulty = e.target.value; });

    gameLoop();
  </script>
</body>
</html>
